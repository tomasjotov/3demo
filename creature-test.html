<!doctype html><html><head><meta charset="utf-8"><title>creature test</title>
<style>html,body{margin:0;height:100%;background:#1c211b;overflow:hidden}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { createCreature } from './src/renderer/creatureRigs.js';
import { ProceduralAvatar } from './src/renderer/ProceduralAvatar.js';
const q = new URLSearchParams(location.search);
const states = (q.get('states') || 'idle').split(',');
const variants = (q.get('v') || 'wolf').split(',');
const looks = q.get('look') ? q.get('look').split(',') : null;    // humanoid bodies: look=skeleton,mummy/base01 (+ layers=a+b)
const view = q.get('view') || (looks ? 'body' : 'side');
const gap = Number(q.get('gap') || (looks ? 1.1 : 1.7));
const Z = Number(q.get('z') || 1);    // zoom out for big beasts
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(innerWidth, innerHeight); r.shadowMap.enabled = true; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x30383a);
scene.add(new THREE.HemisphereLight(0xe8f0ff, 0x4c5a3b, 2));
const sun = new THREE.DirectionalLight(0xfff1d2, 2.5); sun.position.set(3, 6, 4); sun.castShadow = true; scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x5a7a4a }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const items = [];
let i = 0;
for (const v of looks || variants) for (const s of states) {
  const a = looks ? new ProceduralAvatar({ base: v.split('/')[0], variant: v.split('/')[1] || '', layers: (q.get('layers') || '').split('+').filter(Boolean) })
    : createCreature(v);
  a.root.position.set(i * gap, 0, 0); scene.add(a.root);
  const c = { state: s, direction: q.get('dir') || 'E', speed: 3, runMultiplier: 1.6, actionTime: 0, actionDuration: 0, get facing() { return this.direction; } };
  if (s === 'attack') { const ps = (q.get('p') || '.45').split(','); c.actionDuration = .7; c.actionTime = .7 * (1 - Number(ps[i % ps.length])); c.hold = true; }
  items.push({ a, c }); i++;
}
const n = items.length;
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, .1, 100);
const cx = (n - 1) * gap / 2;
if (view === 'side') { cam.position.set(cx, .9 * Z, (2.2 + n * 1.25) * Z); cam.lookAt(cx, .45 * Z, 0); }
else if (view === 'front') { cam.position.set(cx + 3.5 * Z, 1.2 * Z, (2.5 + n) * Z); cam.lookAt(cx, .4 * Z, 0); }
else if (view === 'body') { cam.position.set(cx, 1.15, 2.6 + n * 1.05); cam.lookAt(cx, .9, 0); }
else if (view === 'face') { cam.position.set(cx + .25, 1.7, 1.1 + n * .35); cam.lookAt(cx, 1.58, 0); }
else if (view === 'hub') { cam.position.set(cx + 1.4, 2.4, 8.2); cam.lookAt(cx + .2, .45, 0); scene.background.set(0x1c211b); ground.material.color.set(0x6a9a45); }
else if (view === 'top') { cam.position.set(cx - 1.5 * Z, 3 * Z, 2.2 * Z); cam.lookAt(cx, .5 * Z, 0); }
else { cam.position.set(cx + 4, 6, 6 + n); cam.lookAt(cx, .3, 0); }
const t0 = Number(q.get('t') || 1.2);
// advance simulation to time t0 (fixed steps), freeze attack phase
for (let k = 0; k < t0 * 60; k++) for (const it of items) { const at = it.c.actionTime; it.a.update(it.c, 1 / 60); }
if (view === 'head' || view === 'headside') {            // close-up of the first creature's head
  const h = new THREE.Vector3(); scene.updateMatrixWorld(true); items[0].a.j.head.getWorldPosition(h);
  if (view === 'head') cam.position.set(h.x + .9 * Z, h.y + .25 * Z, h.z + .9 * Z); else cam.position.set(h.x - .2 * Z, h.y + .1 * Z, h.z + 1.3 * Z);
  cam.lookAt(h.x - (view === 'head' ? 0 : .2 * Z), h.y - .05 * Z, h.z);
}
function frame() { if (!q.has('freeze')) for (const it of items) it.a.update(it.c, 1 / 60); r.render(scene, cam); requestAnimationFrame(frame); }
frame();
</script></body></html>
